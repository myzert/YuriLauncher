name: Bug Report
description: 'Report a problem or bug in YuriLauncher'
labels: [Bug]
body:
  - type: dropdown
    id: issue-type
    attributes:
      label: Issue Type
      options:
        - 'Game Issue'
        - 'Launcher Issue'
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Issue Description
      description: |
        Clearly and in detail describe the issue you encountered.
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: Log File
      description: |
        Please upload or paste the latest log file when the issue occurred.
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or Videos
      description: |
        Upload screenshots or videos from the most recent occurrence of the issue.
    validations:
      required: false

  - type: textarea
    id: repetition
    attributes:
      label: Reproduction Steps
      description: |
        Detailed steps to reproduce the issue.
      placeholder: |
        1. Open launcher
        2. Select version...
        3. Launch game...
      render: markdown
    validations:
      required: false

  - type: dropdown
    id: android-version
    attributes:
      label: Android Version
      description: |
        Yuri Launcher requires Android 8.0 or higher.
      options:
        - '16'
        - '15'
        - '14'
        - '13'
        - '12'
        - '11'
        - '10'
        - '9'
        - '8'
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: App Version
      description: |
        Which version of Yuri Launcher did you encounter this issue in? (Check in "About Yuri Launcher" page)
      placeholder: 1.4.1.4
    validations:
      required: true

  - type: dropdown
    id: renderer
    attributes:
      label: Selected Renderer
      description: |
        Selected renderer in settings. Leave blank if not related to in-game rendering.
      options:
        - 'GL4ES'
        - 'Vulkan Zink'
        - 'VirGLRenderer'
        - 'Mobile Glues'
        - 'Freedreno'
        - 'Panfrost'
    validations:
      required: false

  - type: input
    id: device-info
    attributes:
      label: Device Information
      description: |
        Detailed device info (e.g. model, SoC, RAM).
      placeholder: vivo V2247, arm64, 8GB RAM
    validations:
      required: true

  - type: checkboxes
    id: check-issue
    attributes:
      label: Duplicate Check
      options:
        - label: I have searched open/closed issues and found no duplicate
          required: true
